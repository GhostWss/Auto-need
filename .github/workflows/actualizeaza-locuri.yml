# Reface în fiecare noapte fișierul data/places.json din OpenStreetMap.
# Se poate porni și de mână: fila Actions → „Actualizează locurile” → Run workflow.
name: Actualizează locurile

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actualizeaza-locuri.yml'
      - 'tools/fetch-places.js'
      - 'js/osm.js'

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizeaza-locuri
  cancel-in-progress: false

jobs:
  actualizeaza:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Descarcă locurile din OpenStreetMap
        run: node tools/fetch-places.js
      - name: Salvează dacă s-a schimbat ceva
        id: save
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Actualizare locuri din OpenStreetMap"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cere publicarea site-ului
        if: steps.save.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
